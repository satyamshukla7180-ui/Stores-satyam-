/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(list = productData) {

  const container =
    document.getElementById("productsContainer");

  container.innerHTML = "";

  Object.keys(list).forEach(function(id) {

    const product = list[id];

    container.innerHTML += `

      <div
        class="product"
        data-category="${product.category}"
        data-id="${id}"
      >

        <span class="deal-badge">🔥 HOT DEAL</span>

        <button
          class="wishlist-btn"
          onclick="toggleWishlist(this)"
        >
          ♡
        </button>

        <p class="old-price">
          ₹${product.oldPrice.toLocaleString("en-IN")}
        </p>

        <p class="price">
          ₹${product.price}
          <span class="discount">
            ${product.discount}
          </span>
        </p>

        <img
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
        >

        <h3>${product.name}</h3>

        <button
          class="cart-btn"
          onclick="addToCart(this)"
        >
          🛒 Add to Cart
        </button>

        <button
          class="buy"
          onclick="openProductLink('${product.link}')"
        >
          Buy Now
        </button>

      </div>

    `;

  });

  loadWishlist();
}


/* =========================
   WISHLIST
========================= */

function getWishlist() {

  try {

    return JSON.parse(
      localStorage.getItem("satyamWishlist") || "[]"
    );

  } catch {

    return [];

  }

}


function saveWishlist(wishlist) {

  localStorage.setItem(
    "satyamWishlist",
    JSON.stringify(wishlist)
  );

}


function toggleWishlist(button) {

  const product =
    button.closest(".product");

  const productId =
    product.dataset.id;

  let wishlist =
    getWishlist();


  if (wishlist.includes(productId)) {

    wishlist =
      wishlist.filter(function(id) {
        return id !== productId;
      });

  } else {

    wishlist.push(productId);

  }


  saveWishlist(wishlist);

  loadWishlist();

}


function loadWishlist() {

  const wishlist = getWishlist();

  document
    .querySelectorAll(".product")
    .forEach(function(product) {

      const id =
        product.dataset.id;

      const button =
        product.querySelector(".wishlist-btn");

      if (!button) return;


      if (wishlist.includes(id)) {

        button.classList.add("active");
        button.textContent = "♥";

      } else {

        button.classList.remove("active");
        button.textContent = "♡";

      }

    });


  updateWishlistCount();

}


function updateWishlistCount() {

  const count =
    document.getElementById("wishlistCount");

  if (count) {

    count.textContent =
      getWishlist().length;

  }

}


function openWishlist() {

  window.location.href =
    "wishlist.html";

}


/* =========================
   CART
========================= */

function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem("satyamCart") || "[]"
    );

  } catch {

    return [];

  }

}


function saveCart(cart) {

  localStorage.setItem(
    "satyamCart",
    JSON.stringify(cart)
  );

}


function addToCart(button) {

  const product =
    button.closest(".product");

  const productId =
    product.dataset.id;

  const data =
    productData[productId];

  if (!data) {

    alert("Product data not found.");
    return;

  }


  let cart =
    getCart();


  const existing =
    cart.find(function(item) {
      return item.id === productId;
    });


  if (existing) {

    existing.quantity =
      Number(existing.quantity || 0) + 1;

  } else {

    cart.push({

      id: productId,
      name: data.name,
      price: data.price,
      image: data.image,
      link: data.link,
      quantity: 1

    });

  }


  saveCart(cart);

  updateCartCount();


  button.textContent =
    "✓ Added";

  button.classList.add("added");


  setTimeout(function() {

    button.textContent =
      "🛒 Add to Cart";

    button.classList.remove("added");

  }, 1000);

}


function updateCartCount() {

  const cart =
    getCart();

  const count =
    cart.reduce(function(total, item) {

      return total +
        Number(item.quantity || 0);

    }, 0);


  const cartCount =
    document.getElementById("cartCount");


  if (cartCount) {

    cartCount.textContent =
      count;

  }


  localStorage.setItem(
    "satyamCartCount",
    count
  );

}


function openCart() {

  window.location.href =
    "cart.html";

}


/* =========================
   SEARCH
========================= */

function searchProducts() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  document
    .querySelectorAll(".product")
    .forEach(function(product) {

      const name =
        product
          .querySelector("h3")
          .textContent
          .toLowerCase();

      const category =
        product.dataset.category
          .toLowerCase();


      product.style.display =
        (
          name.includes(text) ||
          category.includes(text)
        )
          ? ""
          : "none";

    });

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category) {

  document
    .getElementById("searchInput")
    .value = "";


  document
    .querySelectorAll(".product")
    .forEach(function(product) {

      if (
        category === "all" ||
        product.dataset.category === category
      ) {

        product.style.display = "";

      } else {

        product.style.display = "none";

      }

    });

}


/* =========================
   BUY NOW
========================= */

function openProductLink(link) {

  if (!link) {

    alert("Product link is not available.");
    return;

  }


  window.open(
    link,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    displayProducts();

    updateCartCount();

    updateWishlistCount();

  }
);

</script>
