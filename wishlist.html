/* =========================
   GET WISHLIST
========================= */

function getWishlist() {

  try {

    return JSON.parse(
      localStorage.getItem("satyamWishlist") || "[]"
    );

  } catch {

    return [];

  }

}


/* =========================
   SAVE WISHLIST
========================= */

function saveWishlist(wishlist) {

  localStorage.setItem(
    "satyamWishlist",
    JSON.stringify(wishlist)
  );

}


/* =========================
   DISPLAY
========================= */

function displayWishlist() {

  const container =
    document.getElementById("wishlistItems");

  container.innerHTML = "";

  const wishlist =
    getWishlist();


  if (wishlist.length === 0) {

    container.innerHTML = `

      <div class="empty-cart">

        <h2>❤️ Your wishlist is empty</h2>

        <p>
          Add products to your wishlist.
        </p>

        <button
          class="buy"
          onclick="continueShopping()"
        >
          🛍️ Browse Products
        </button>

      </div>

    `;

    return;

  }


  wishlist.forEach(function(id) {

    const product =
      products[id];

    if (!product) return;


    container.innerHTML += `

      <div class="cart-item">

        <img
          src="${product.image}"
          alt="${product.name}"
        >

        <div class="cart-info">

          <h3>
            ${product.name}
          </h3>

          <p class="price">
            ₹${product.price}
          </p>

          <button
            class="buy"
            onclick="buyProduct('${id}')"
          >
            🛒 Buy Now
          </button>

          <button
            class="cart-btn"
            onclick="addToCart('${id}')"
          >
            🛒 Add to Cart
          </button>

          <button
            class="remove-btn"
            onclick="removeFromWishlist('${id}')"
          >
            ❤️ Remove
          </button>

        </div>

      </div>

    `;

  });

}


/* =========================
   REMOVE
========================= */

function removeFromWishlist(id) {

  let wishlist =
    getWishlist();


  wishlist =
    wishlist.filter(function(item) {

      return item !== id;

    });


  saveWishlist(wishlist);

  displayWishlist();

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id) {

  const product =
    products[id];

  if (!product) return;


  let cart =
    JSON.parse(
      localStorage.getItem("satyamCart") || "[]"
    );


  const existing =
    cart.find(function(item) {

      return item.id === id;

    });


  if (existing) {

    existing.quantity =
      Number(existing.quantity || 0) + 1;

  } else {

    cart.push({

      id: id,
      name: product.name,
      price: product.price,
      image: product.image,
      link: product.link,
      quantity: 1

    });

  }


  localStorage.setItem(
    "satyamCart",
    JSON.stringify(cart)
  );


  updateCartCount();


  alert("🛒 Product added to cart!");

}


/* =========================
   CART COUNT
========================= */

function updateCartCount() {

  const cart =
    JSON.parse(
      localStorage.getItem("satyamCart") || "[]"
    );


  const count =
    cart.reduce(function(total, item) {

      return total +
        Number(item.quantity || 0);

    }, 0);


  localStorage.setItem(
    "satyamCartCount",
    count
  );

}


/* =========================
   BUY
========================= */

function buyProduct(id) {

  const product =
    products[id];

  if (!product || !product.link) {

    alert(
      "Product link is not available."
    );

    return;

  }


  window.open(
    product.link,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================
   CONTINUE SHOPPING
========================= */

function continueShopping() {

  window.location.href =
    "index.html";

}


/* =========================
   LOAD
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    displayWishlist();

  }
);
